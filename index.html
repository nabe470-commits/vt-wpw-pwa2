<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1"/>
  <title>ECG 学習アプリ（VT/WPW/PAC/PVC 完全版・修正版）</title>

  <!-- Tailwind + React (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>body{background:#0b0c10;color:#e5e7eb}</style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ---------- 共通UI ---------- */
    const TabButton = ({active,onClick,children}) => (
      <button onClick={onClick} className={
        "px-4 py-2 rounded-full text-sm font-medium transition border "+
        (active?"bg-white text-gray-900 border-gray-300 shadow":"bg-transparent text-gray-200 border-gray-700 hover:bg-gray-800")
      }>{children}</button>
    );
    const Card = ({children,className=""}) => (
      <div className={"rounded-2xl border border-gray-800 bg-[#0f1115] p-5 shadow-lg "+className}>{children}</div>
    );
    const Pill = ({children}) => (
      <span className="inline-block rounded-full bg-gray-800/80 px-2.5 py-1 text-xs text-gray-200 border border-gray-700">{children}</span>
    );
    const Divider = () => (<div className="my-6 h-px bg-gradient-to-r from-transparent via-gray-800 to-transparent"/>);
    const CheckItem = ({text}) => (
      <li className="flex items-start gap-2 leading-snug">
        <span className="mt-1 inline-block h-4 w-4 shrink-0 rounded-md border border-gray-700 bg-gray-900/60"></span>
        <span>{text}</span>
      </li>
    );

    /* ---------- アルゴリズム：VT / WPW / PAC ---------- */
    const VT_RULES = [
      { title:"まずは安全原則", bullets:[
        "不安定（ショック/胸痛/低血圧/意識障害）→ 同期下カルディオバージョン",
        "安定Wide QRS頻拍→ まずVTとして扱う"
      ]},
      { title:"VT支持 “赤旗”", bullets:[
        "AV解離 / Capture / Fusion","極端な軸（右上/北西軸）",
        "胸部誘導の陽性/陰性コンコーダンス",
        "aVR: 初期R / 初期40ms上向き / Vi/Vt<1"
      ]},
      { title:"Brugada 4段階（簡略）", bullets:[
        "① 全胸部でRSなし → VT","② いずれか胸部でRS間隔>100ms → VT",
        "③ AV解離 → VT","④ 形態基準（LBBB様/RBBB様）でVT支持"
      ]},
      { title:"Vereckei（aVR）", bullets:[
        "初期R / 初期40ms上向き / Vi/Vt<1 → VT支持",
        "該当なければSVT with aberrancyも検討"
      ]},
    ];
    const WPW_RULES = [
      { title:"WPWの基本", bullets:["短PR+デルタ波","AVRTの基盤"]},
      { title:"頻拍時初期対応", bullets:[
        "正行性AVRT（狭QRS）→ 迷走→アデノシン",
        "pre-excited AF（不規則Wide）→ AVN遮断薬（ベラパミル/β遮断/ジギ/ジルチ）は避ける",
        "不安定→ 同期下CV"
      ]},
      { title:"薬物（例）", bullets:["pre-excited AF：プロカインアミド/イブチリド（施設プロトコール準拠）"]},
    ];
    const PAC_RULES = [
      { title:"PACの見抜き方", bullets:[
        "洞より早いP′（形が洞Pと異なる）",
        "P′後QRSあり→伝導／なし→非伝導PAC",
        "PAC後RRは非代償性が多い（洞リセット）"
      ]},
      { title:"PAC + 変行伝導（Ashman）", bullets:[
        "Long–Short直後にRBBB様WideQRS","起源は上室→VTと混同しない"
      ]},
      { title:"落とし穴", bullets:[
        "非伝導PACは房室ブロックと誤診されやすい→Tの肩に隠れたP′を拡大で探す",
        "PAC vs PVCはP′位置と先行RRが鍵"
      ]},
    ];

    /* ---------- 局在：VT / WPW / PAC / PVC / CHD ---------- */
    const VT_LOCALIZATION = [
      {title:"LBBB様 vs RBBB様", bullets:["V1陰性(LBBB様)→右室起源","V1陽性(RBBB様)→左室起源"]},
      {title:"軸と移行帯", bullets:["下方軸→流出路","上方軸→流入路/心尖/後壁","移行V2以前→左室寄り / V4以降→右室寄り"]},
      {title:"流出路の目安", bullets:["V2 transition ratio>0.6→LVOT示唆","aVL深S・aVR高R→左冠尖近傍"]},
      {title:"ファシキュラーVT", bullets:["RBBB様+上方軸→左後枝（Verapamil感受性）","RBBB様+下方軸→左前枝"]}
    ];
    const WPW_LOCALIZATION = [
      {title:"デルタ波の極性で大枠", bullets:["V1陰性→右側","V1陽性→左側","下壁陰性→後中隔","I/aVL陽性+V1陽性→左側側壁"]},
      {title:"代表組合せ", bullets:["左側側壁：I/aVL/V6陽性+V1陽性","右前中隔：V1深陰性+I/aVL陰性","後中隔：下壁陰性"]}
    ];
    const PAC_LOCALIZATION = [
      {title:"P′軸", bullets:["下方軸（II/III/aVF陽性）→上位右房/洞近傍","上方軸（II/III/aVF陰性）→下位右房/左房/CS入口部"]},
      {title:"V1のP′", bullets:["陽性→右房自由壁/前方","陰性→左房後方/肺静脈","二相性(+/−)→右房中隔/CS入口部寄り","二相性(−/+)→左房中隔寄り"]}
    ];

    const WPW_MAP = [
      { site:"左側側壁（LL）",   v1:"+", inf:"+",     iavl:"+",  v6:"+",       hint:"I/aVL/V6強陽性 + V1陽性" },
      { site:"左前側壁（LAL）",  v1:"+", inf:"+/±",   iavl:"+",  v6:"+",       hint:"前方寄り。側壁誘導が総じて陽性" },
      { site:"左後側壁（LPL）",  v1:"+", inf:"−/±",   iavl:"+",  v6:"+",       hint:"下壁陰性混じり→後方寄り" },
      { site:"左後中隔（LPS）",  v1:"+/二相", inf:"−", iavl:"±", v6:"+/±",     hint:"下壁陰性→後中隔" },
      { site:"右側側壁（RL）",   v1:"−", inf:"+",     iavl:"−",  v6:"−/低R",   hint:"V1陰性 + I/aVL陰性" },
      { site:"右前中隔（RAS）",  v1:"深い−", inf:"+/±", iavl:"−", v6:"低R/−", hint:"V1が最も陰性化" },
      { site:"右後中隔（RPS）",  v1:"−/二相", inf:"−", iavl:"−/±", v6:"−/±",  hint:"下壁陰性 + 右側要素" },
      { site:"中隔中央（MS）",   v1:"二相(+/− or −/+)", inf:"±", iavl:"±", v6:"±", hint:"等電位気味／決め手弱い" }
    ];

    const PVC_MAP = [
      { site:"RVOT（右室流出路）",       v1:"LBBB様（陰性）", axis:"下方軸", trans:"遅い（V4以降）", aux:"aVR低R / V6高R", hint:"LBBB様+下方軸+遅い移行→RVOT" },
      { site:"LVOT（左室流出路/左冠尖）", v1:"LBBB様（陰性）", axis:"下方軸", trans:"早い（V2〜V3）", aux:"aVL深S・aVR高R", hint:"V2 TR>0.6ならLVOT" },
      { site:"RCC周辺（右冠尖）",        v1:"LBBB様", axis:"下方軸", trans:"やや早い", aux:"I小R / aVL陰性", hint:"LVOT右寄り" },
      { site:"RV inflow/後壁",           v1:"LBBB様", axis:"上方軸", trans:"遅い", aux:"下壁陰性", hint:"LBBB様+上方軸→流入路/後壁" },
      { site:"左後枝（Fascicular）",     v1:"RBBB様（陽性）", axis:"上方軸", trans:"可変", aux:"V5-6でS深", hint:"Verapamil感受性" },
      { site:"左前枝（Fascicular）",     v1:"RBBB様（陽性）", axis:"下方軸", trans:"可変", aux:"V5-6でS深", hint:"RBBB様+下方軸" },
      { site:"Papillary muscle（LV）",   v1:"RBBB様", axis:"可変", trans:"可変", aux:"V1広R / V6深S", hint:"乳頭筋PVC" },
      { site:"LV summit/側壁高位",       v1:"RBBB様", axis:"下方軸", trans:"早い", aux:"I/aVL高R", hint:"到達困難域のことあり" },
    ];

    const CHD_MAP = [
      { dz:"ASD（二次孔）", axis:"右軸偏位", qrs:"rSr′(V1)/不完全RBBB", p:"右房負荷(P高)", note:"右室容量負荷。固定性分裂が臨床" },
      { dz:"AVSD（ECD）",  axis:"左軸偏位", qrs:"右脚ブロック",         p:"両房拡大",     note:"左軸+RBBBが典型" },
      { dz:"TOF",          axis:"右軸〜右上軸", qrs:"右室肥大型",        p:"±右房負荷",    note:"RV圧負荷" },
      { dz:"TGA",          axis:"右軸 or 正軸", qrs:"右室肥大型",        p:"正常",         note:"新生児〜RV優位" },
      { dz:"三尖弁閉鎖",    axis:"左軸偏位",     qrs:"左室肥大",          p:"右房負荷",     note:"ASD合併で房負荷" },
      { dz:"肺動脈閉鎖",    axis:"右軸偏位",     qrs:"右室肥大",          p:"右房負荷",     note:"重症で低電位化も" },
      { dz:"Ebstein奇形",   axis:"右軸偏位",     qrs:"RBBB様",            p:"巨大P(右房)",  note:"WPW合併多い/PR延長" },
      { dz:"WPW合併先天疾患",axis:"右軸+Δ波",     qrs:"短PR+デルタ波",     p:"高P波",        note:"RPS経路が最多" },
    ];

    /* ---------- 概念図（SVG：テキストの > は &gt;） ---------- */
    const WaveSVG = ({type}) => {
      const grid = () => (
        <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d={`M20 0H0 M0 20V0`} stroke="#1f2937" strokeWidth="1" />
        </pattern>
      );
      const path = {
        vt_mono:"M10,80 L60,80 L80,60 L100,110 L120,70 L140,90 L160,80 L180,80 L200,60 L220,110 L240,70 L260,90 L280,80",
        delta_pos:"M10,100 L40,100 Q55,95 70,120 T100,100 L140,100",
        af_irregular:"M10,80 q10,-10 20,0 t20,0 t20,0 t20,0 M80,80 L100,40 L120,110 L140,50 L160,120 L180,60 L200,110",
        capture_fusion:"M10,80 L60,80 L80,60 L100,110 L120,70 L140,90 L160,60 L170,80 L190,60 L210,110 L230,70 L250,90",
        pac:"M10,100 L60,100 L80,90 L90,95 L100,100 L140,100",
        pac_blocked:"M10,100 L60,100 L80,90 L90,95 L100,100 L140,100 L160,100",
        pac_aberrant:"M10,100 L60,100 L80,90 L90,95 L100,100 L120,100 L140,110 L160,95 L180,100",
      };
      return (
        <svg viewBox="0 0 300 160" className="w-full rounded-xl border border-gray-800 bg-gray-900">
          <defs>{grid()}</defs>
          <rect width="100%" height="100%" fill="url(#g)"/>
          <path d={path[type]||path.vt_mono} stroke="#60a5fa" style={{strokeWidth:2,fill:"none"}}/>
        </svg>
      );
    };

    /* ---------- 暗記カード ---------- */
    const FLASHCARDS = [
      { q:"Wide QRS頻拍の安全原則は？", a:"まずVTとして扱う" },
      { q:"Brugada第1段階は？", a:"全胸部でRSが無いか（あればVT）" },
      { q:"aVRでVT支持の一文は？", a:"初期R/初期40ms上向き/Vi/Vt<1" },
      { q:"pre-excited AFで禁忌は？", a:"AVN遮断（ベラパミル/β遮断/ジギ/ジルチ）" },
      { q:"V2 transition ratio>0.6＝？", a:"LVOT示唆" },
      { q:"PACの非代償性とは？", a:"洞リセット→RRが2×基礎RRより短い" },
      { q:"PVC：LBBB様＋下方軸＋遅い移行＝？", a:"RVOT" },
    ];

    /* ---------- Quiz ---------- */
    const QUIZ = [
      { stem:"aVRで初期R。まず疑う？", options:["SVT","VT","AVNRT","洞頻拍"], answer:1, explain:"初期R/初期40ms上向き/Vi/Vt<1はVT支持。" },
      { stem:"Brugada第1段階：全胸部でRSなし。結論は？", options:["SVT支持","VT支持","所見なし","洞徐脈"], answer:1, explain:"R単相/QSのみはVT。" },
      { stem:"V2 transition ratio>0.6。示唆？", options:["RVOT","LVOT","AVNRT","洞不全"], answer:1, explain:"LVOT示唆。" },
      { stem:"pre-excited AFで避けるべき？", options:["プロカインアミド","イブチリド","ベラパミル","同期下CV"], answer:2, explain:"AVN遮断は禁忌。" },
      { stem:"PAC：Long–Short後にRBBB様Wide。示唆？", options:["VT","PAC with aberrancy(Ashman)","PVC","WPW"], answer:1, explain:"上室起源のまま。" },
      { stem:"WPW：V1陽性 + I/aVL陽性 + V6高R。示唆？", options:["右側側壁","左側側壁","右前中隔","後中隔"], answer:1, explain:"左側側壁。" },
      { stem:"WPW：V1陰性 + 下壁陰性。まず疑う？", options:["左前側壁","中隔中央","後中隔","高位右房"], answer:2, explain:"後中隔寄り（PS）。" },
      { stem:"PVC：LBBB様＋下方軸＋移行帯が遅い（V4以降）。示唆？", options:["LVOT","RVOT","左前枝","乳頭筋"], answer:1, explain:"RVOT。" },
      { stem:"PVC：LBBB様＋下方軸＋移行帯が早い（V2〜V3）、aVL深S/aVR高R。示唆？", options:["LVOT（左冠尖）","RV inflow","左後枝","LV summit"], answer:0, explain:"LVOT。" },
      { stem:"PVC：RBBB様＋上方軸。示唆？", options:["左後枝（Fascicular）","右室流入路","RVOT","右側側壁"], answer:0, explain:"左後枝PVC。" },
      { stem:"ASD（二次孔）で頻出の軸/波形は？", options:["左軸+RBBB","右軸+rSr′(V1)","正軸+LBBB","左軸+LBBB"], answer:1, explain:"右室容量負荷→右軸+rSr′。" },
      { stem:"AVSD（ECD）の典型は？", options:["右軸+rSr′","左軸+RBBB","右軸+LBBB","左軸+LBBB"], answer:1, explain:"左軸+RBBB。" }
    ];

    /* ---------- Components ---------- */
    const RuleBlock = ({title,bullets}) => (
      <Card>
        <div className="flex items-start justify-between gap-3"><h3 className="text-base font-semibold text-white">{title}</h3></div>
        <ul className="mt-3 space-y-2 text-sm text-gray-200">{bullets.map((b,i)=><CheckItem key={i} text={b}/>)}</ul>
      </Card>
    );
    const AlgorithmColumn = ({title,rules}) => (
      <div className="space-y-4">
        <div className="flex items-center justify-between"><h2 className="text-lg font-bold text-white">{title}</h2></div>
        {rules.map((r,i)=><RuleBlock key={i} title={r.title} bullets={r.bullets}/>)}
      </div>
    );
    const MnemonicRow = ({list}) => (
      <div className="grid gap-2 sm:grid-cols-2">
        {list.map((m,i)=>(
          <div key={i} className="flex items-center justify-between rounded-xl border border-gray-800 bg-gray-900/40 px-3 py-2">
            <span className="text-xs text-gray-300"><b className="mr-2 inline-block rounded bg-gray-800 px-2 py-0.5 text-[10px] border border-gray-700">{m.tag}</b>{m.text}</span>
          </div>
        ))}
      </div>
    );

    const Flashcards = () => {
      const [idx,setIdx]=useState(0); const [show,setShow]=useState(false);
      const next=()=>{setShow(false);setIdx(i=>(i+1)%FLASHCARDS.length)}; const prev=()=>{setShow(false);setIdx(i=>(i-1+FLASHCARDS.length)%FLASHCARDS.length)};
      const c=FLASHCARDS[idx];
      return (
        <Card>
          <div className="flex items-center justify-between"><h3 className="text-base font-semibold">暗記カード</h3>
            <div className="flex gap-2"><button onClick={prev} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">←</button>
              <button onClick={next} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">→</button></div></div>
          <Divider/>
          <div className="grid gap-4 sm:grid-cols-2">
            <div className="rounded-xl border border-gray-800 bg-gray-900/50 p-4"><div className="text-xs text-gray-400">Question</div><div className="mt-2 text-lg font-semibold text-white">{c.q}</div></div>
            <div className="rounded-xl border border-gray-800 bg-gray-900/50 p-4"><div className="text-xs text-gray-400">Answer</div>
              <button onClick={()=>setShow(s=>!s)} className="mt-2 rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">{show?"隠す":"表示"}</button>
              {show&&<div className="mt-3 text-base text-emerald-300">{c.a}</div>}
            </div>
          </div>
        </Card>
      );
    };

    const Quiz = ({onWrongChange}) => {
      const [answers,setAnswers]=useState(Array(QUIZ.length).fill(null));
      const [revealed,setRevealed]=useState(false);
      const score=useMemo(()=>answers.reduce((a,v,i)=>a+(v===QUIZ[i].answer?1:0),0),[answers]);
      useEffect(()=>{ if(revealed){ const wrong=QUIZ.map((q,i)=>answers[i]===q.answer?null:i).filter(x=>x!==null); try{localStorage.setItem("vtwpw_wrong",JSON.stringify(wrong))}catch{}; onWrongChange&&onWrongChange(wrong); } },[revealed,answers,onWrongChange]);
      return (
        <Card>
          <div className="flex items-center justify-between"><h3 className="text-base font-semibold">クイズ（{QUIZ.length}問）</h3>
            <div className="text-sm text-gray-300">{revealed?`得点: ${score}/${QUIZ.length}`:<span className="text-gray-500">回答を選択</span>}</div></div>
          <Divider/>
          <div className="space-y-6">
            {QUIZ.map((q,qi)=>(
              <div key={qi} className="rounded-xl border border-gray-800 bg-gray-900/40 p-4">
                <div className="text-sm font-semibold text-white">{qi+1}. {q.stem}</div>
                <div className="mt-3 grid gap-2 sm:grid-cols-2">
                  {q.options.map((opt,oi)=>{
                    const picked=answers[qi]===oi, correct=revealed&&oi===q.answer, wrong=revealed&&picked&&oi!==q.answer;
                    return (
                      <button key={oi} onClick={()=>{ if(!revealed){ setAnswers(prev=>prev.map((v,idx)=>idx===qi?oi:v)); } }}
                        className={"flex items-center justify-between rounded-lg border px-3 py-2 text-left text-sm transition "+
                          (correct?"border-emerald-500/60 bg-emerald-500/10":
                           wrong?"border-rose-500/60 bg-rose-500/10":
                           picked?"border-blue-500/60 bg-blue-500/10":"border-gray-800 bg-gray-900/40 hover:bg-gray-800/40")}>
                        <span>{opt}</span>{correct&&<span className="text-emerald-400">◎</span>}{wrong&&<span className="text-rose-400">×</span>}
                      </button>
                    );
                  })}
                </div>
                {revealed&&<div className="mt-2 text-xs text-gray-300">解説：{q.explain}</div>}
              </div>
            ))}
          </div>
          <div className="mt-4 flex flex-wrap justify-end gap-2">
            <button onClick={()=>{ try{localStorage.removeItem("vtwpw_wrong")}catch{}; setAnswers(Array(QUIZ.length).fill(null)); setRevealed(false); }}
              className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">リセット</button>
            <button onClick={()=>setRevealed(true)} className="rounded-lg border border-gray-500 bg-white/5 px-3 py-1 text-sm hover:bg-white/10">採点する</button>
          </div>
        </Card>
      );
    };

    /* ---------- セクション ---------- */
    const Localize = () => (
      <div className="grid gap-6 2xl:grid-cols-3 xl:grid-cols-2">
        <div className="space-y-4"><AlgorithmColumn title="VT局在：形態・軸・移行帯" rules={VT_LOCALIZATION}/></div>
        <div className="space-y-4"><AlgorithmColumn title="WPW局在：デルタ波極性" rules={WPW_LOCALIZATION}/></div>
        <div className="space-y-4"><AlgorithmColumn title="PAC局在：P′軸とV1" rules={PAC_LOCALIZATION}/></div>

        {/* WPW起源マップ */}
        <Card>
          <h3 className="text-base font-semibold">WPW起源マップ（暗記用 早見表）</h3>
          <div className="mt-2 text-xs text-gray-400">V1（左右）→ 下壁（後中隔）→ I/aVL（左右補強）の3手で当てる</div>
          <Divider/>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">起源候補</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">V1 Δ</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">II/III/aVF</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">I/aVL</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">V6</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">ヒント</th>
              </tr></thead>
              <tbody>{WPW_MAP.map((r,i)=>(
                <tr key={i}>
                  <td className="border border-gray-800 px-2 py-1">{r.site}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.v1}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.inf}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.iavl}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.v6}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.hint}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </Card>

        {/* PVC起源マップ */}
        <Card>
          <h3 className="text-base font-semibold">PVC起源マップ（暗記用 早見表）</h3>
          <Divider/>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">起源候補</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">V1形</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">電気軸</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">移行帯</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">補助所見</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">覚え方</th>
              </tr></thead>
              <tbody>{PVC_MAP.map((r,i)=>(
                <tr key={i}>
                  <td className="border border-gray-800 px-2 py-1">{r.site}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.v1}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.axis}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.trans}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.aux}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.hint}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </Card>

        {/* 先天性心疾患 ECG */}
        <Card>
          <h3 className="text-base font-semibold">先天性心疾患に特徴的な心電図（出題頻度高）</h3>
          <Divider/>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">疾患</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">軸偏位</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">QRS/波形</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">P波</th>
                <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">要点</th>
              </tr></thead>
              <tbody>{CHD_MAP.map((r,i)=>(
                <tr key={i}>
                  <td className="border border-gray-800 px-2 py-1">{r.dz}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.axis}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.qrs}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.p}</td>
                  <td className="border border-gray-800 px-2 py-1">{r.note}</td>
                </tr>
              ))}</tbody>
            </table>
          </div>
        </Card>
      </div>
    );

    const Gallery = () => (
      <div className="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
        <Card><h3 className="text-base font-semibold">単形性VT（概念図）</h3><div className="mt-3"><WaveSVG type="vt_mono"/></div></Card>
        <Card><h3 className="text-base font-semibold">デルタ波（概念図）</h3><div className="mt-3"><WaveSVG type="delta_pos"/></div></Card>
        <Card><h3 className="text-base font-semibold">pre-excited AF（概念図）</h3><div className="mt-3"><WaveSVG type="af_irregular"/></div></Card>
        <Card><h3 className="text-base font-semibold">Capture / Fusion</h3><div className="mt-3"><WaveSVG type="capture_fusion"/></div></Card>
        <Card><h3 className="text-base font-semibold">PAC（伝導）</h3><div className="mt-3"><WaveSVG type="pac"/></div></Card>
        <Card><h3 className="text-base font-semibold">非伝導PAC</h3><div className="mt-3"><WaveSVG type="pac_blocked"/></div></Card>
        <Card><h3 className="text-base font-semibold">PAC with aberrancy</h3><div className="mt-3"><WaveSVG type="pac_aberrant"/></div></Card>
      </div>
    );

    /* Brugadaフロー（SVG内の > は &gt; に） */
    const BrugadaFlow = () => (
      <div className="space-y-4">
        <Card>
          <h2 className="text-lg font-bold text-white">Brugada 4段階アルゴリズム（図解）</h2>
          <Divider/>
          <div className="grid gap-4 lg:grid-cols-2">
            <div className="space-y-2 text-sm text-gray-200">
              <ol className="list-decimal space-y-1 pl-5">
                <li>全胸部で <b>RSが無い</b> → VT</li>
                <li>いずれか胸部で <b>RS間隔 ＞ 100ms</b> → VT</li>
                <li><b>AV解離</b> あり → VT</li>
                <li>形態基準（LBBB様/RBBB様）でVT支持</li>
              </ol>
              <p className="text-xs text-gray-400">※ どこかで“はい”ならVT優先。全て“いいえ”ならSVT with 伝導障害を検討。</p>
            </div>
            <div>
              <svg viewBox="0 0 520 360" className="w-full rounded-xl border border-gray-800 bg-gray-900">
                <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#6ee7b7"/><stop offset="100%" stopColor="#93c5fd"/></linearGradient></defs>
                <g fontFamily="system-ui" fontSize="12" fill="#e5e7eb" textAnchor="middle">
                  <rect x="170" y="10" width="180" height="44" rx="10" stroke="#374151" fill="#111827"/><text x="260" y="38">Wide QRS 頻拍</text>
                  <rect x="20" y="90" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="120" y="122">① RSなし? → VT</text>
                  <rect x="300" y="90" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="400" y="122">② RS&gt;100ms? → VT</text>
                  <rect x="20" y="180" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="120" y="212">③ AV解離? → VT</text>
                  <rect x="300" y="180" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="400" y="212">④ 形態基準</text>
                  <rect x="20" y="270" width="200" height="54" rx="10" stroke="#10b981" fill="#064e3b"/><text x="120" y="302">VTとして対応</text>
                  <rect x="300" y="270" width="200" height="54" rx="10" stroke="#3b82f6" fill="#0b3b75"/><text x="400" y="302">SVT + 変行</text>
                </g>
                <g stroke="url(#g1)" strokeWidth="2" fill="none">
                  <path d="M260 54 V 90"/><path d="M120 144 V 180"/><path d="M400 144 V 180"/><path d="M120 234 V 270"/><path d="M400 234 V 270"/>
                </g>
              </svg>
            </div>
          </div>
        </Card>
      </div>
    );

    const Notes = () => {
      const [text,setText]=useState(""); useEffect(()=>{ try{const s=localStorage.getItem("vtwpw_notes"); if(s) setText(s);}catch{} },[]);
      const save=()=>{ try{localStorage.setItem("vtwpw_notes",text)}catch{} };
      return (
        <Card>
          <div className="flex items-center justify-between"><h3 className="text-base font-semibold">自分用ノート</h3>
            <button onClick={save} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">保存</button></div>
          <textarea className="mt-3 w-full min-h-48 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm text-gray-100 outline-none"
            placeholder="講義メモ、症例の気づき…" value={text} onChange={e=>setText(e.target.value)} />
        </Card>
      );
    };

    /* ---------- App ---------- */
    function App(){
      const [tab,setTab]=useState("alg");
      const [algoSide,setAlgoSide]=useState("VT");
      const [wrongIdx,setWrongIdx]=useState([]);
      useEffect(()=>{ try{const raw=localStorage.getItem("vtwpw_wrong"); if(raw) setWrongIdx(JSON.parse(raw));}catch{} },[]);
      const date=new Date();
      return (
        <div className="min-h-screen text-gray-100">
          <main className="mx-auto max-w-6xl px-4 py-8">
            <header className="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h1 className="text-2xl font-bold tracking-tight text-white">ECG 学習アプリ（VT/WPW/PAC/PVC 完全版・修正版）</h1>
                <p className="text-sm text-gray-400">アルゴリズム総まとめ／WPW・PAC・PVC起源マップ／先天性ECG表／暗記カード＆クイズ</p>
              </div>
              <div className="flex items-center gap-2">
                <Pill>v2.7</Pill><Pill>{date.toLocaleDateString()}</Pill>
                {wrongIdx?.length>0 && <Pill>誤答 {wrongIdx.length}</Pill>}
              </div>
            </header>

            <div className="mb-6 flex flex-wrap gap-2">
              <TabButton active={tab==="alg"} onClick={()=>setTab("alg")}>Algorithms</TabButton>
              <TabButton active={tab==="brugada"} onClick={()=>setTab("brugada")}>Brugada Flow</TabButton>
              <TabButton active={tab==="loc"} onClick={()=>setTab("loc")}>Localize</TabButton>
              <TabButton active={tab==="gallery"} onClick={()=>setTab("gallery")}>Gallery</TabButton>
              <TabButton active={tab==="flash"} onClick={()=>setTab("flash")}>Flashcards</TabButton>
              <TabButton active={tab==="quiz"} onClick={()=>setTab("quiz")}>Quiz</TabButton>
              <TabButton active={tab==="notes"} onClick={()=>setTab("notes")}>Notes</TabButton>
            </div>

            {tab==="alg" && (
              <div className="grid gap-6 lg:grid-cols-2">
                <div className="space-y-4">
                  <Card>
                    <div className="flex items-center justify-between">
                      <h2 className="text-lg font-bold">アルゴリズム（切替）</h2>
                      <div className="flex gap-2">
                        {["VT","WPW","PAC"].map(k=>(
                          <button key={k} onClick={()=>setAlgoSide(k)}
                            className={"rounded-full border px-3 py-1 text-sm transition "+(algoSide===k?"border-white bg-white text-gray-900":"border-gray-700 hover:bg-gray-800")}>{k}</button>
                        ))}
                      </div>
                    </div>
                  </Card>
                  {algoSide==="VT"  && <AlgorithmColumn title="Wide QRS頻拍 → VT優先で判断" rules={VT_RULES}/>}
                  {algoSide==="WPW" && <AlgorithmColumn title="WPW：認識・初期対応・禁忌・根治" rules={WPW_RULES}/>}
                  {algoSide==="PAC" && <AlgorithmColumn title="PAC：見抜き方・変行伝導・落とし穴" rules={PAC_RULES}/>}
                </div>

                <div className="space-y-4">
                  <Card>
                    <h3 className="text-base font-semibold">スピード暗記モード（片手で流し読み）</h3>
                    <Divider/>
                    <div className="grid gap-3">
                      <div><div className="text-xs text-gray-400">VT一文</div><div className="mt-1 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm">
                        Wide QRSは<b>まずVT</b>。<b>AV解離/捕捉・融合</b>、<b>Brugada</b>、<b>aVR</b>で詰める。
                      </div></div>
                      <div><div className="text-xs text-gray-400">WPW一文</div><div className="mt-1 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm">
                        不規則Wideは<b>pre-excited AF</b>。<b>AVN遮断薬は避ける</b>。
                      </div></div>
                      <div><div className="text-xs text-gray-400">PAC一文</div><div className="mt-1 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm">
                        早期の<b>P′</b>を探す。<b>非代償性休止</b>、<b>非伝導PAC</b>、<b>Ashman</b>に注意。
                      </div></div>
                    </div>
                  </Card>
                  <Flashcards/>
                </div>
              </div>
            )}

            {tab==="brugada" && <BrugadaFlow/>}
            {tab==="loc" && <Localize/>}
            {tab==="gallery" && <Gallery/>}
            {tab==="flash" && (<div className="space-y-4">
              <MnemonicRow list={[
                {tag:"VT",text:"RSなし→RS>100→AV解離→形態"},
                {tag:"WPW",text:"pre-excited AFにAVN遮断薬は禁忌"},
                {tag:"PAC",text:"P′の形・位置とRRで判断"},
                {tag:"PVC",text:"V1形 + 軸 + 移行帯で推定"}
              ]}/>
              <Flashcards/>
            </div>)}
            {tab==="quiz" && <Quiz onWrongChange={(w)=>setWrongIdx(w)}/>}
            {tab==="notes" && <Notes/>}

            <footer className="mt-10 text-center text-xs text-gray-500">
              * 学習支援用。実臨床では施設プロトコール・最新ガイドラインに従ってください。
            </footer>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
