<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>VT・WPW・PAC 学習アプリ（完全版+++）</title>

  <!-- Tailwind + React (CDN) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>body{background:#0b0c10;color:#e5e7eb}</style>
</head>
<body>
  <div id="root"></div>

  <!-- ★ 以下をそのまま貼るだけでOK -->
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    /* ========== UI helpers ========== */
    const TabButton = ({ active, onClick, children }) => (
      <button onClick={onClick} className={
        "px-4 py-2 rounded-full text-sm font-medium transition border " +
        (active ? "bg-white text-gray-900 border-gray-300 shadow" :
                  "bg-transparent text-gray-200 border-gray-700 hover:bg-gray-800")
      }>{children}</button>
    );
    const Card = ({ children, className="" }) => (
      <div className={"rounded-2xl border border-gray-800 bg-[#0f1115] p-5 shadow-lg " + className}>{children}</div>
    );
    const Pill = ({ children }) => (
      <span className="inline-block rounded-full bg-gray-800/80 px-2.5 py-1 text-xs text-gray-200 border border-gray-700">{children}</span>
    );
    const Divider = () => (<div className="my-6 h-px bg-gradient-to-r from-transparent via-gray-800 to-transparent" />);
    const CheckItem = ({ text }) => (
      <li className="flex items-start gap-2 leading-snug">
        <span className="mt-1 inline-block h-4 w-4 shrink-0 rounded-md border border-gray-700 bg-gray-900/60" />
        <span>{text}</span>
      </li>
    );

    /* ========== Data: VT / WPW / PAC ========== */
    const VT_RULES = [
      { title:"まずは病態評価", bullets:[
        "不安定→ 同期下カルディオバージョン",
        "安定Wide QRS頻拍→ まずVTとして扱う"
      ]},
      { title:"VTを強く示唆", bullets:[
        "AV解離 / Capture / Fusion",
        "極端な軸（右上/北西）",
        "胸部誘導の陽性/陰性コンコーダンス",
        "aVR 初期40ms上向き or 初期R"
      ]},
      { title:"Brugada 4段階", bullets:[
        "① 全胸部でRSなし→VT",
        "② RS間隔>100ms→VT",
        "③ AV解離→VT",
        "④ 形態基準（LBBB様/RBBB様）"
      ]},
      { title:"Vereckei (aVR)", bullets:[
        "初期R / 初期40ms上向き / Vi/Vt<1 → VT支持",
        "該当なければSVT with 変行伝導も検討"
      ]},
    ];

    const WPW_RULES = [
      { title:"WPWの基本", bullets:["PR短縮+デルタ波","副伝導路によりAVRT"]},
      { title:"頻拍時の初期対応", bullets:[
        "正行性AVRT（狭QRS）→ 迷走→アデノシン",
        "pre-excited AF（不規則Wide）はAVN遮断薬を避ける",
        "不安定→ 同期下CV"
      ]},
      { title:"先行興奮AFの薬物", bullets:[
        "推奨：プロカインアミド/イブチリド（施設プロトコール）",
        "避ける：ベラパミル/ジルチ/β遮断/ジギタリス"
      ]},
    ];

    const PAC_RULES = [
      { title:"PACの見抜き方", bullets:[
        "洞より早いP'（形が洞Pと異なる）",
        "P'後にQRS→伝導PAC / 出ない→非伝導PAC",
        "PAC後RRは非代償性が多い（洞リセット）"
      ]},
      { title:"PAC + 変行伝導（Ashman）", bullets:[
        "Long–Short直後にRBBB様で広いQRS",
        "起源は上室→VTと混同しない"
      ]},
      { title:"鑑別の落とし穴", bullets:[
        "非伝導PACは房室ブロックと誤診されやすい",
        "PAC with aberrancy とPVCの鑑別はP'位置・RR"
      ]},
    ];

    /* 局在 */
    const VT_LOCALIZATION = [
      {title:"LBBB様 vs RBBB様", bullets:["V1陰性（LBBB様）→右室起源","V1陽性（RBBB様）→左室起源"]},
      {title:"軸・移行帯", bullets:["下方軸→流出路","上方軸→流入路/後壁","移行V2以前→LV寄り / V4以降→RV寄り"]},
      {title:"RVOT vs LVOT", bullets:["V2 transition ratio>0.6→LVOT","aVL深いS・aVR高R→左冠尖近傍"]},
      {title:"ファシキュラーVT", bullets:["RBBB様+上方軸→左後枝","RBBB様+下方軸→左前枝"]},
    ];
    const WPW_LOCALIZATION = [
      {title:"デルタ波の極性", bullets:["V1陰性→右側","V1陽性→左側","下壁陰性→後中隔","I/aVL陽性+V1陽性→左側側壁"]},
      {title:"代表組合せ", bullets:["左側側壁：I/aVL/V6陽性+V1陽性","右前中隔：V1深い陰性+I/aVL陰性","後中隔：下壁陰性"]},
    ];
    const PAC_LOCALIZATION = [
      {title:"P'軸", bullets:["下方軸（II/III/aVF陽性）→上位右房/洞近傍","上方軸（II/III/aVF陰性）→下位右房/左房/CS入口部寄り"]},
      {title:"V1のP'", bullets:["V1二相性→中隔/左房の手掛かり","V1陽性→右房自由壁/前方","V1陰性→左房後方"]},
      {title:"Tips", bullets:["P'はTに重なることあり→拡大で確認","PRは変動し得る"]},
    ];

    /* PAC起源マップ（暗記用 早見表） */
    const PAC_MAP = [
      { site: "高位右房/クリスタ〜RAA", inf: "+", iavl: "+", v1: "陽性",           hint:"鋭いP′/頻回PACで多い" },
      { site: "右房中隔（上）",          inf: "+", iavl: "±", v1: "二相性(+/−)",   hint:"CSより前方" },
      { site: "CS入口部（下位RA）",       inf: "−", iavl: "±", v1: "二相性(+/−)",   hint:"Long–Short後に出やすい" },
      { site: "右房自由壁（下）",         inf: "−", iavl: "+", v1: "陽性/平坦",     hint:"I陽性=右側寄り" },
      { site: "左房後壁/肺静脈",          inf: "−", iavl: "−", v1: "陰性",         hint:"P′幅がやや広い" },
      { site: "左房中隔/LAA",            inf: "−", iavl: "−", v1: "二相性(−/+)",   hint:"aVL陰性が鍵" },
    ];

    /* SVGギャラリー */
    const WaveSVG = ({ type }) => {
      const grid = () => (
        <pattern id="g" width="20" height="20" patternUnits="userSpaceOnUse">
          <path d={`M20 0H0 M0 20V0`} stroke="#1f2937" strokeWidth="1" />
        </pattern>
      );
      const path = {
        vt_mono: "M10,80 L60,80 L80,60 L100,110 L120,70 L140,90 L160,80 L180,80 L200,60 L220,110 L240,70 L260,90 L280,80",
        delta_pos: "M10,100 L40,100 Q55,95 70,120 T100,100 L140,100",
        af_irregular: "M10,80 q10,-10 20,0 t20,0 t20,0 t20,0 M80,80 L100,40 L120,110 L140,50 L160,120 L180,60 L200,110",
        capture_fusion: "M10,80 L60,80 L80,60 L100,110 L120,70 L140,90 L160,60 L170,80 L190,60 L210,110 L230,70 L250,90",
        pac: "M10,100 L60,100 L80,90 L90,95 L100,100 L140,100",
        pac_blocked: "M10,100 L60,100 L80,90 L90,95 L100,100 L140,100 L160,100",
        pac_aberrant: "M10,100 L60,100 L80,90 L90,95 L100,100 L120,100 L140,110 L160,95 L180,100",
      };
      return (
        <svg viewBox="0 0 300 160" className="w-full rounded-xl border border-gray-800 bg-gray-900">
          <defs>{grid()}</defs>
          <rect width="100%" height="100%" fill="url(#g)" />
          <path d={path[type] || path.vt_mono} stroke="#60a5fa" style={{strokeWidth:2, fill:"none"}} />
        </svg>
      );
    };

    /* フラッシュカード */
    const FLASHCARDS = [
      { q:"Brugadaの最初のステップは？", a:"全胸部でRSがないか確認" },
      { q:"aVRでVT支持の一文は？", a:"初期R/初期40ms上向き/Vi/Vt<1" },
      { q:"pre-excited AFで避ける薬群？", a:"AVN遮断（ベラパミル/β遮断/ジギタリス/ジルチ）" },
      { q:"PACの非代償性とは？", a:"洞結節リセット→RRが2×基礎RRより短い" },
    ];

    /* Quiz（PAC含む増量＋起源推定3問追加＝31問） */
    const QUIZ = [
      { stem:"aVRで初期R。まず疑う？", options:["SVT with aberrancy","VT","AVNRT","洞調律"], answer:1, explain:"aVR初期R/初期40ms上向きはVT支持。" },
      { stem:"Brugada第1段階：全胸部でRSなし。結論は？", options:["SVT支持","VT支持","所見なし","洞徐脈"], answer:1, explain:"R単相/QSのみ→VT。" },
      { stem:"RS間隔>100ms。結論は？", options:["VT支持","SVT支持","判定不能","心房粗動"], answer:0, explain:"第2段階でVT支持。" },
      { stem:"陽性コンコーダンスの意味は？", options:["VT支持","SVT支持","洞頻拍","WPW"], answer:0, explain:"胸部全R単相→VT支持。" },
      { stem:"不安定なWideQRS頻拍の第一選択は？", options:["アデノシン","同期下CV","ベラパミル","経口β遮断"], answer:1, explain:"循環動態不安定はCV。" },
      { stem:"V1陰性LBBB様+下方軸。起源は？", options:["RVOT","LVOT","左後枝","心房"], answer:0, explain:"流出路→RVOT。" },
      { stem:"V1陽性RBBB様+aVL深いS/aVR高R。示唆？", options:["右室流入路","左冠尖/左室流出路","右側側壁","後中隔"], answer:1, explain:"LVOT/左冠尖。" },
      { stem:"V2 transition ratio>0.6 は？", options:["RVOT","LVOT","AVNRT","洞不全"], answer:1, explain:"LVOT示唆。" },
      { stem:"Verapamil感受性VTの形態は？", options:["RBBB様+上方軸","LBBB様+下方軸","RBBB様+下方軸","狭QRS"], answer:0, explain:"左後枝起源。" },
      { stem:"pre-excited AFで避ける薬は？", options:["プロカインアミド","イブチリド","ジギタリス","同期下CV"], answer:2, explain:"AVN遮断薬は禁忌。" },
      { stem:"安定正行性AVRTの初手？", options:["同期下CV","迷走神経刺激","ベラパミル静注","アミオダロン"], answer:1, explain:"迷走→アデノシン。" },
      { stem:"V1陰性デルタ+下壁陰性デルタ。局在？", options:["左側側壁","右前中隔","後中隔","左前側壁"], answer:2, explain:"右側+下壁陰性→後中隔。" },
      { stem:"I/aVL/V6陽性デルタ+V1陽性。局在？", options:["左側側壁","右側側壁","右前中隔","後中隔"], answer:0, explain:"左側側壁。" },
      { stem:"PACの所見として正しい？", options:["P'は洞Pと同形","P'は洞より早く形が異なる","常に代償性休止","常に広いQRS"], answer:1, explain:"早期かつP'形が異なる。" },
      { stem:"非伝導PAC（blocked PAC）の特徴？", options:["P'後にQRSが出る","洞結節はリセットされない","P'後にQRSが出ない","常に代償性"], answer:2, explain:"QRSなし、RRは非代償性が多い。" },
      { stem:"PAC後RRが2×基礎RRより短い。意味？", options:["代償性休止","非代償性（洞リセット）","AV解離","房室ブロック"], answer:1, explain:"洞リセット。" },
      { stem:"Long–Short後にRBBB様で広いQRS。最も考える？", options:["PAC with aberrancy（Ashman）","PVC","VT","WPW"], answer:0, explain:"典型的Ashman。" },
      { stem:"非伝導PACは何と誤診されやすい？", options:["房室ブロック","心房粗動","洞徐脈","AVNRT"], answer:0, explain:"AVBと誤診注意。" },
      { stem:"PACとPVC鑑別の第一歩？", options:["QRS幅のみ","P'の有無と位置","T波形","QTc"], answer:1, explain:"P'とRR。" },
      { stem:"P'が下方軸（II/III/aVF陽性）。示唆？", options:["上位右房/洞近傍","下位右房/CS入口部/左房","右房自由壁","房室結節"], answer:0, explain:"下方軸→上位右房。" },
      { stem:"P'が上方軸（II/III/aVF陰性）。示唆？", options:["洞近傍","下位右房/CS入口部/左房","右房自由壁"], answer:1, explain:"下位/左房寄り。" },
      { stem:"V1でP'二相性（+/−）。示唆？", options:["右房自由壁","右房中隔/左房起源","左室起源","房室結節"], answer:1, explain:"中隔/左房の手掛かり。" },
      { stem:"Wide QRS頻拍の“まずの原則”は？", options:["SVT扱い","VT扱い","アデノシン静注","経口Ca拮抗薬"], answer:1, explain:"安全側でVT扱い。" },
      { stem:"Capture/Fusionは何を示唆？", options:["SVT","心室起源","房室結節リエントリー","洞頻拍"], answer:1, explain:"VT支持。" },
      { stem:"Vereckei（aVR）Vi/Vt<1。示唆？", options:["SVT支持","VT支持","AVB","洞徐脈"], answer:1, explain:"VT支持。" },
      { stem:"PAC with aberrancy とVTの鑑別で有用？", options:["P'位置と先行RR","QTc","U波","電気軸"], answer:0, explain:"P'とLong–Short。" },
      /* ▼ PAC起源推定 追加3問 */
      { stem:"V1陰性・II/III/aVF陰性・I/aVL陰性のP′。最も示唆？",
        options:["高位右房/RAA","右房中隔（上）","CS入口部/下位右房","左房後壁/肺静脈"], answer:3,
        explain:"V1陰性 + 下壁陰性 + I/aVL陰性 → 左房後方/肺静脈寄り。" },
      { stem:"V1二相性(+/−)・II/III/aVF陰性。最も示唆？",
        options:["右房自由壁（下）","CS入口部（下位右房）","左房中隔/LAA","高位右房"], answer:1,
        explain:"二相性(+/−)+下壁陰性はCS入口部〜下位RAを示唆。" },
      { stem:"V1陽性・II/III/aVF陽性・I/aVL陽性。最も示唆？",
        options:["左房後壁/肺静脈","右房中隔（上）","高位右房/RAA","左房中隔"], answer:2,
        explain:"V1陽性+下壁陽性+I/aVL陽性 → 高位右房/RAA。" },
    ];

    /* ========== Components ========== */
    const RuleBlock = ({ title, bullets }) => (
      <Card>
        <div className="flex items-start justify-between gap-3"><h3 className="text-base font-semibold text-white">{title}</h3></div>
        <ul className="mt-3 space-y-2 text-sm text-gray-200">{bullets.map((b,i)=>(<CheckItem key={i} text={b}/>))}</ul>
      </Card>
    );
    const AlgorithmColumn = ({ title, rules, mnemonics }) => (
      <div className="space-y-4">
        <div className="flex items-center justify-between">
          <h2 className="text-lg font-bold text-white">{title}</h2>
          {mnemonics && <div className="flex gap-2">{mnemonics.slice(0,3).map((m,i)=>(<Pill key={i}>{m.tag}</Pill>))}</div>}
        </div>
        {rules.map((r,i)=>(<RuleBlock key={i} title={r.title} bullets={r.bullets}/>))}
      </div>
    );
    const MnemonicRow = ({ list }) => (
      <div className="grid gap-2 sm:grid-cols-2">
        {list.map((m,i)=>(
          <div key={i} className="flex items-center justify-between rounded-xl border border-gray-800 bg-gray-900/40 px-3 py-2">
            <span className="text-xs text-gray-300"><b className="mr-2 inline-block rounded bg-gray-800 px-2 py-0.5 text-[10px] border border-gray-700">{m.tag}</b>{m.text}</span>
          </div>
        ))}
      </div>
    );
    const Flashcards = () => {
      const [idx,setIdx]=useState(0); const [show,setShow]=useState(false);
      const next=()=>{setShow(false);setIdx(i=>(i+1)%FLASHCARDS.length)}; const prev=()=>{setShow(false);setIdx(i=>(i-1+FLASHCARDS.length)%FLASHCARDS.length)};
      const c=FLASHCARDS[idx];
      return (<Card>
        <div className="flex items-center justify-between"><h3 className="text-base font-semibold">フラッシュカード</h3><div className="flex gap-2"><button onClick={prev} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">←</button><button onClick={next} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">→</button></div></div>
        <Divider/>
        <div className="grid gap-4 sm:grid-cols-2">
          <div className="rounded-xl border border-gray-800 bg-gray-900/50 p-4"><div className="text-xs text-gray-400">Question</div><div className="mt-2 text-lg font-semibold text-white">{c.q}</div></div>
          <div className="rounded-xl border border-gray-800 bg-gray-900/50 p-4"><div className="text-xs text-gray-400">Answer</div><button onClick={()=>setShow(s=>!s)} className="mt-2 rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">{show?"隠す":"表示"}</button>{show && <div className="mt-3 text-base text-emerald-300">{c.a}</div>}</div>
        </div>
      </Card>);
    };
    const Quiz = ({ onWrongChange }) => {
      const [answers,setAnswers]=useState(Array(QUIZ.length).fill(null));
      const [revealed,setRevealed]=useState(false);
      const score=useMemo(()=>answers.reduce((a,v,i)=>a+(v===QUIZ[i].answer?1:0),0),[answers]);
      useEffect(()=>{ if(revealed){ const wrong=QUIZ.map((q,i)=>answers[i]===q.answer?null:i).filter(x=>x!==null); try{localStorage.setItem("vtwpw_wrong",JSON.stringify(wrong))}catch{}; onWrongChange&&onWrongChange(wrong);} },[revealed,answers,onWrongChange]);
      return (<Card>
        <div className="flex items-center justify-between"><h3 className="text-base font-semibold">クイズ（単一正答・{QUIZ.length}問）</h3><div className="text-sm text-gray-300">{revealed?`得点: ${score}/${QUIZ.length}`:<span className="text-gray-500">回答を選択</span>}</div></div>
        <Divider/>
        <div className="space-y-6">
          {QUIZ.map((q,qi)=>(
            <div key={qi} className="rounded-xl border border-gray-800 bg-gray-900/40 p-4">
              <div className="text-sm font-semibold text-white">{qi+1}. {q.stem}</div>
              <div className="mt-3 grid gap-2 sm:grid-cols-2">
                {q.options.map((opt,oi)=>{
                  const picked=answers[qi]===oi; const correct=revealed && oi===q.answer; const wrong=revealed && picked && oi!==q.answer;
                  return (<button key={oi} onClick={()=>{ if(!revealed){ setAnswers(prev=>prev.map((v,idx)=>idx===qi?oi:v)); }}} className={
                    "flex items-center justify-between rounded-lg border px-3 py-2 text-left text-sm transition "+
                    (correct?"border-emerald-500/60 bg-emerald-500/10": wrong?"border-rose-500/60 bg-rose-500/10": picked?"border-blue-500/60 bg-blue-500/10":"border-gray-800 bg-gray-900/40 hover:bg-gray-800/40")
                  }><span>{opt}</span>{correct && <span className="text-emerald-400">◎</span>}{wrong && <span className="text-rose-400">×</span>}</button>);
                })}
              </div>
              {revealed && <div className="mt-2 text-xs text-gray-300">解説：{q.explain}</div>}
            </div>
          ))}
        </div>
        <div className="mt-4 flex flex-wrap justify-end gap-2">
          <button onClick={()=>{ try{localStorage.removeItem("vtwpw_wrong")}catch{}; setAnswers(Array(QUIZ.length).fill(null)); setRevealed(false); }} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">リセット</button>
          <button onClick={()=>setRevealed(true)} className="rounded-lg border border-gray-500 bg-white/5 px-3 py-1 text-sm hover:bg-white/10">採点する</button>
        </div>
      </Card>);
    };
    const Review = () => {
      const [wrong,setWrong]=useState([]); useEffect(()=>{ try{const raw=localStorage.getItem("vtwpw_wrong"); if(raw) setWrong(JSON.parse(raw));}catch{} },[]);
      const [answers,setAnswers]=useState([]); const [revealed,setRevealed]=useState(false);
      const items=wrong.map(i=>QUIZ[i]).filter(Boolean);
      const score=useMemo(()=>answers.reduce((a,v,i)=>a+(v===items[i]?.answer?1:0),0),[answers,items]);
      return (<Card>
        <div className="flex items-center justify-between"><h3 className="text-base font-semibold">誤答復習（{items.length}問）</h3>{revealed && <div className="text-sm text-gray-300">{`得点: ${score}/${items.length}`}</div>}</div>
        <Divider/>
        {items.length===0? <div className="text-sm text-gray-400">誤答はまだ記録されていません。Quiz採点で自動保存。</div> :
          <div className="space-y-6">
            {items.map((q,qi)=>(
              <div key={qi} className="rounded-xl border border-gray-800 bg-gray-900/40 p-4">
                <div className="text-sm font-semibold text-white">{qi+1}. {q.stem}</div>
                <div className="mt-3 grid gap-2 sm:grid-cols-2">
                  {q.options.map((opt,oi)=>{
                    const picked=answers[qi]===oi; const correct=revealed && oi===q.answer; const wrongpick=revealed && picked && oi!==q.answer;
                    return (<button key={oi} onClick={()=>{ if(!revealed){ const arr=[...answers]; arr[qi]=oi; setAnswers(arr);} }} className={
                      "flex items-center justify-between rounded-lg border px-3 py-2 text-left text-sm transition "+
                      (correct?"border-emerald-500/60 bg-emerald-500/10": wrongpick?"border-rose-500/60 bg-rose-500/10": picked?"border-blue-500/60 bg-blue-500/10":"border-gray-800 bg-gray-900/40 hover:bg-gray-800/40")
                    }><span>{opt}</span>{correct && <span className="text-emerald-400">◎</span>}{wrongpick && <span className="text-rose-400">×</span>}</button>);
                  })}
                </div>
                {revealed && <div className="mt-2 text-xs text-gray-300">解説：{q.explain}</div>}
              </div>
            ))}
          </div>}
        <div className="mt-4 flex justify-end gap-2">
          <button onClick={()=>{ try{localStorage.removeItem("vtwpw_wrong")}catch{}; setWrong([]); setAnswers([]); setRevealed(false); }} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">クリア</button>
          <button onClick={()=>setRevealed(true)} className="rounded-lg border border-gray-500 bg-white/5 px-3 py-1 text-sm hover:bg-white/10">採点する</button>
        </div>
      </Card>);
    };

    /* 画面セクション */
    const Localize = () => (
      <div className="grid gap-6 xl:grid-cols-3 lg:grid-cols-2">
        <div className="space-y-4"><AlgorithmColumn title="VT局在：形態・軸・移行帯" rules={VT_LOCALIZATION} /></div>
        <div className="space-y-4"><AlgorithmColumn title="WPW局在：デルタ波極性" rules={WPW_LOCALIZATION} /></div>
        <div className="space-y-4">
          <AlgorithmColumn title="PAC局在：P'軸とV1" rules={PAC_LOCALIZATION} />
          <Card>
            <h3 className="text-base font-semibold">PAC起源マップ（暗記用 早見表）</h3>
            <Divider/>
            <div className="overflow-x-auto">
              <table className="w-full text-sm">
                <thead>
                  <tr>
                    <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">起源候補</th>
                    <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">II/III/aVF</th>
                    <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">I/aVL</th>
                    <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">V1 P′</th>
                    <th className="border border-gray-800 bg-gray-900/70 px-2 py-1 text-left">ヒント</th>
                  </tr>
                </thead>
                <tbody>
                  {PAC_MAP.map((r,i)=>(
                    <tr key={i}>
                      <td className="border border-gray-800 px-2 py-1">{r.site}</td>
                      <td className="border border-gray-800 px-2 py-1">{r.inf}</td>
                      <td className="border border-gray-800 px-2 py-1">{r.iavl}</td>
                      <td className="border border-gray-800 px-2 py-1">{r.v1}</td>
                      <td className="border border-gray-800 px-2 py-1">{r.hint}</td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          </Card>
        </div>
      </div>
    );
    const Gallery = () => (
      <div className="grid gap-6 md:grid-cols-2 xl:grid-cols-3">
        <Card><h3 className="text-base font-semibold">単形性VT（概念図）</h3><div className="mt-3"><WaveSVG type="vt_mono"/></div></Card>
        <Card><h3 className="text-base font-semibold">デルタ波（概念図）</h3><div className="mt-3"><WaveSVG type="delta_pos"/></div></Card>
        <Card><h3 className="text-base font-semibold">pre-excited AF（概念図）</h3><div className="mt-3"><WaveSVG type="af_irregular"/></div></Card>
        <Card><h3 className="text-base font-semibold">Capture / Fusion</h3><div className="mt-3"><WaveSVG type="capture_fusion"/></div></Card>
        <Card><h3 className="text-base font-semibold">PAC（伝導）</h3><div className="mt-3"><WaveSVG type="pac"/></div></Card>
        <Card><h3 className="text-base font-semibold">非伝導PAC</h3><div className="mt-3"><WaveSVG type="pac_blocked"/></div></Card>
        <Card><h3 className="text-base font-semibold">PAC with aberrancy</h3><div className="mt-3"><WaveSVG type="pac_aberrant"/></div></Card>
      </div>
    );

    /* Brugadaフローチャート（SVG内の > は &gt; に） */
    const BrugadaFlow = () => (
      <div className="space-y-4">
        <Card>
          <h2 className="text-lg font-bold text-white">Brugada 4段階アルゴリズム（図解）</h2>
          <Divider/>
          <div className="grid gap-4 lg:grid-cols-2">
            <div className="space-y-2 text-sm text-gray-200">
              <ol className="list-decimal space-y-1 pl-5">
                <li>全胸部で <b>RSが無い</b> → VT</li>
                <li>いずれか胸部で <b>RS間隔 ＞ 100ms</b> → VT</li>
                <li><b>AV解離</b> あり → VT</li>
                <li>形態基準（LBBB様/RBBB様）でVT支持</li>
              </ol>
              <p className="text-xs text-gray-400">※ どこかで“はい”ならVT優先。全て“いいえ”ならSVT with 伝導障害を検討。</p>
            </div>
            <div>
              <svg viewBox="0 0 520 360" className="w-full rounded-xl border border-gray-800 bg-gray-900">
                <defs><linearGradient id="g1" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stopColor="#6ee7b7"/><stop offset="100%" stopColor="#93c5fd"/></linearGradient></defs>
                <g fontFamily="system-ui" fontSize="12" fill="#e5e7eb" textAnchor="middle">
                  <rect x="170" y="10" width="180" height="44" rx="10" stroke="#374151" fill="#111827"/><text x="260" y="38">Wide QRS 頻拍</text>
                  <rect x="20" y="90" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="120" y="122">① RSなし? → VT</text>
                  <rect x="300" y="90" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="400" y="122">② RS&gt;100ms? → VT</text>
                  <rect x="20" y="180" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="120" y="212">③ AV解離? → VT</text>
                  <rect x="300" y="180" width="200" height="54" rx="10" stroke="#374151" fill="#111827"/><text x="400" y="212">④ 形態基準</text>
                  <rect x="20" y="270" width="200" height="54" rx="10" stroke="#10b981" fill="#064e3b"/><text x="120" y="302">VTとして対応</text>
                  <rect x="300" y="270" width="200" height="54" rx="10" stroke="#3b82f6" fill="#0b3b75"/><text x="400" y="302">SVT + 変行</text>
                </g>
                <g stroke="url(#g1)" strokeWidth="2" fill="none">
                  <path d="M260 54 V 90"/><path d="M120 144 V 180"/><path d="M400 144 V 180"/><path d="M120 234 V 270"/><path d="M400 234 V 270"/>
                </g>
              </svg>
            </div>
          </div>
        </Card>
      </div>
    );

    /* WPW 25分割（簡易表） */
    const WPWMap = () => {
      const headers=[" ","Anterior","Antero-septal","Septal","Postero-septal","Lateral"];
      const rows=[
        {side:"Left Superior", cells:["I,aVL,V6デルタ陽性","V1陽性","-","下壁±","側壁強陽性"]},
        {side:"Left Mid",      cells:["I,aVL,V6陽性","V1陽性","-","下壁±","側壁陽性"]},
        {side:"Left Inferior", cells:["I陽性 aVL控えめ","V1陽性","-","下壁陽性","側壁陽性"]},
        {side:"Right Superior",cells:["I/aVL陰性化","V1陰性デルタ強","前中隔陰性","下壁±","V6陰性化"]},
        {side:"Right Inferior",cells:["I陰性化","V1陰性デルタ","後中隔寄りで下壁陰性","下壁陰性強","V6陰性"]},
      ];
      return (<div className="space-y-4">
        <Card>
          <h2 className="text-lg font-bold text-white">WPW局在 25分割（暗記用 簡易表）</h2>
          <p className="mt-1 text-xs text-gray-400">デルタ波極性（I/aVL/V1/V6/下壁）で大枠を推定。最終局在はEPで決定。</p>
          <Divider/>
          <div className="overflow-x-auto">
            <table className="w-full text-sm">
              <thead><tr>{headers.map((h,i)=>(<th key={i} className="border border-gray-800 bg-gray-900/70 px-2 py-2 text-left text-gray-200">{h}</th>))}</tr></thead>
              <tbody>{rows.map((r,ri)=>(
                <tr key={ri}>
                  <td className="whitespace-nowrap border border-gray-800 bg-gray-900/40 px-2 py-2 text-gray-300">{r.side}</td>
                  {r.cells.map((c,ci)=>(<td key={ci} className="border border-gray-800 px-2 py-2 text-gray-100">{c}</td>))}
                </tr>
              ))}</tbody>
            </table>
          </div>
        </Card>
      </div>);
    };

    /* Notes */
    const Notes = () => {
      const [text,setText]=useState(""); useEffect(()=>{ try{const s=localStorage.getItem("vtwpw_notes"); if(s) setText(s);}catch{} },[]);
      const save=()=>{ try{localStorage.setItem("vtwpw_notes",text)}catch{} };
      return (<Card>
        <div className="flex items-center justify-between"><h3 className="text-base font-semibold">自分用ノート</h3><button onClick={save} className="rounded-lg border border-gray-700 px-3 py-1 text-sm hover:bg-gray-800">保存</button></div>
        <textarea className="mt-3 w-full min-h-48 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm text-gray-100 outline-none" placeholder="講義メモ、症例の気づき…" value={text} onChange={e=>setText(e.target.value)} />
      </Card>);
    };

    /* App */
    function App(){
      const [tab,setTab]=useState("alg");
      const [algoSide,setAlgoSide]=useState("VT");
      const [wrongIdx,setWrongIdx]=useState([]);
      useEffect(()=>{ try{ const raw=localStorage.getItem("vtwpw_wrong"); if(raw) setWrongIdx(JSON.parse(raw)); }catch{} },[]);
      const date=new Date();
      return (
        <div className="min-h-screen text-gray-100">
          <main className="mx-auto max-w-6xl px-4 py-8">
            <header className="mb-6 flex flex-col gap-3 sm:flex-row sm:items-end sm:justify-between">
              <div>
                <h1 className="text-2xl font-bold tracking-tight text-white">VT・WPW・PAC 学習アプリ（完全版+++）</h1>
                <p className="text-sm text-gray-400">1級向け｜アルゴリズム・局在・波形例・クイズ＆誤答復習</p>
              </div>
              <div className="flex items-center gap-2">
                <Pill>v2.3</Pill>
                <Pill>{date.toLocaleDateString()}</Pill>
                {wrongIdx?.length>0 && <Pill>誤答 {wrongIdx.length}</Pill>}
              </div>
            </header>

            <div className="mb-6 flex flex-wrap gap-2">
              <TabButton active={tab==="alg"} onClick={()=>setTab("alg")}>Algorithms</TabButton>
              <TabButton active={tab==="brugada"} onClick={()=>setTab("brugada")}>Brugada Flow</TabButton>
              <TabButton active={tab==="loc"} onClick={()=>setTab("loc")}>Localize</TabButton>
              <TabButton active={tab==="wpwmap"} onClick={()=>setTab("wpwmap")}>WPW 25Map</TabButton>
              <TabButton active={tab==="gallery"} onClick={()=>setTab("gallery")}>Gallery</TabButton>
              <TabButton active={tab==="flash"} onClick={()=>setTab("flash")}>Flashcards</TabButton>
              <TabButton active={tab==="quiz"} onClick={()=>setTab("quiz")}>Quiz</TabButton>
              <TabButton active={tab==="review"} onClick={()=>setTab("review")}>Review</TabButton>
              <TabButton active={tab==="notes"} onClick={()=>setTab("notes")}>Notes</TabButton>
            </div>

            {tab==="alg" && (
              <div className="grid gap-6 lg:grid-cols-2">
                <div className="space-y-4">
                  <Card>
                    <div className="flex items-center justify-between">
                      <h2 className="text-lg font-bold">アルゴリズム（切替）</h2>
                      <div className="flex gap-2">
                        {["VT","WPW","PAC"].map(k=>(
                          <button key={k} onClick={()=>setAlgoSide(k)} className={"rounded-full border px-3 py-1 text-sm transition "+(algoSide===k?"border-white bg-white text-gray-900":"border-gray-700 hover:bg-gray-800")}>{k}</button>
                        ))}
                      </div>
                    </div>
                  </Card>
                  {algoSide==="VT" && <AlgorithmColumn title="Wide QRS頻拍 → VT優先で判断" rules={VT_RULES} />}
                  {algoSide==="WPW" && <AlgorithmColumn title="WPW：認識・初期対応・禁忌・根治" rules={WPW_RULES} />}
                  {algoSide==="PAC" && <AlgorithmColumn title="PAC：見抜き方・変行伝導・落とし穴" rules={PAC_RULES} />}
                </div>

                <div className="space-y-4">
                  <Card>
                    <h3 className="text-base font-semibold">スピード暗記モード</h3>
                    <Divider/>
                    <div className="grid gap-3">
                      <div><div className="text-xs text-gray-400">一文（VT）</div><div className="mt-1 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm">Wide QRS頻拍は<b>まずVT</b>。<b>AV解離/捕捉・融合</b>、<b>Brugada</b>、<b>aVR</b>で詰める。</div></div>
                      <div><div className="text-xs text-gray-400">一文（WPW）</div><div className="mt-1 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm">不規則Wideは<b>pre-excited AF</b>。<b>AVN遮断薬は避ける</b>。</div></div>
                      <div><div className="text-xs text-gray-400">一文（PAC）</div><div className="mt-1 rounded-xl border border-gray-800 bg-gray-900/50 p-3 text-sm">早期の<b>P'</b>を探す。<b>非代償性休止</b>、<b>非伝導PAC</b>、<b>Ashman</b>に注意。</div></div>
                    </div>
                  </Card>
                  <Flashcards/>
                </div>
              </div>
            )}

            {tab==="brugada" && <BrugadaFlow/>}
            {tab==="loc" && <Localize/>}
            {tab==="wpwmap" && <WPWMap/>}
            {tab==="gallery" && <Gallery/>}
            {tab==="flash" && (<div className="space-y-4"><MnemonicRow list={[{tag:"VT",text:"RSなし→RS>100→AV解離→形態"},{tag:"WPW",text:"pre-excited AFにAVN遮断薬は禁忌"},{tag:"PAC",text:"P'の形と位置・非代償性を確認"}]} /><Flashcards/></div>)}
            {tab==="quiz" && <Quiz onWrongChange={(w)=>setWrongIdx(w)} />}
            {tab==="review" && <Review/>}
            {tab==="notes" && <Notes/>}

            <footer className="mt-10 text-center text-xs text-gray-500">* 本ツールは学習支援用。実臨床では施設プロトコール・最新ガイドラインに従ってください。</footer>
          </main>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
  </script>
</body>
</html>
